amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.10
    alpha2: 0.10
    alpha3: 0.15
    alpha4: 0.10
    alpha5: 0.10
    base_frame_id: base_nav
    global_frame_id: map
    odom_frame_id: odom
    # Localization uses its own structural-height projection.  The stricter
    # ground-relative /scan remains dedicated to dynamic obstacle avoidance.
    scan_topic: scan_localization
    map_topic: map
    robot_model_type: omnidirectional
    laser_model_type: likelihood_field
    laser_min_range: 0.60
    # Long-range structure improves global localization.  Dynamic obstacle
    # avoidance remains independently capped at 4 m below.
    laser_max_range: 8.0
    laser_likelihood_max_dist: 1.0
    # The projected PCD map is dense and locally repetitive.  Use enough
    # structural beams/particles for the initial correction instead of
    # declaring success from a sparse 120-beam sample.
    max_beams: 360
    min_particles: 1000
    max_particles: 5000
    pf_err: 0.02
    pf_z: 0.99
    sigma_hit: 0.12
    z_hit: 0.95
    z_rand: 0.05
    z_max: 0.0
    z_short: 0.0
    update_min_d: 0.02
    update_min_a: 0.02
    resample_interval: 1
    # Keep Foxy AMCL's random-recovery injection disabled.  On this arm64
    # 0.4.7 build, a captured SIGSEGV resolves to
    # pf_update_resample -> AmclNode::uniformPoseGenerator when these are
    # non-zero.  Normal sensor resampling and explicit initial-pose
    # refinement remain active.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    transform_tolerance: 0.50
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: true
    save_pose_rate: -1.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: nav_control
    odom_topic: /Odometry_navigation
    enable_groot_monitoring: false
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

# Nav2 is only the outer path follower.  /cmd_vel is clamped by
# g1_cmd_vel_udp (vx 0.60, vy 0.20, wz 0.50) and executed by
# nav/locomotion/g1_locomotion_executor.py, i.e. our Balance/Homie policies
# with the pelvis-IMU heading outer loop and the shared 0.4 s command filter.
# DWB retains conservative acceleration limits for trajectory prediction.
controller_server:
  ros__parameters:
    use_sim_time: false
    # 20 Hz matches the LiDAR. Walking commands pass the executor's 0.4 s
    # filter and cart commands the cart student's trained reference filter
    # (ref_alpha 0.05 at 50 Hz, tau ~0.39 s), so a faster outer loop changed
    # nothing at the body but cost navigation CPU that the cart camera and
    # FAST-LIO need. The 50 Hz policies and the 200 Hz bridge hold the latest
    # command between updates.
    controller_frequency: 20.0
    odom_topic: /Odometry_navigation
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    # Walking keeps DWB (FollowPath); the cart pushes with pure pursuit.
    controller_plugins: ["CartPush", "FollowPath"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.20
      required_movement_angle: 0.20
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 2026-10-23 operator choice: 0.25 m / 20 deg. The ~0.8 s push chain made
      # the final 0.15 m / 10 deg correction slow. Foxy has one goal checker,
      # so walking (FollowPath) uses the same tolerance.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3490658503988659  # 20 degrees
      stateful: true
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "unitree_nav2_core::ApproachDWBLocalPlanner"
      trajectory_generator_name: "unitree_nav2_core::SpeedLimitedGenerator"
      navigation_speed_mode: "auto"
      navigation_speed: 0.35
      approach_distance: 0.60
      approach_speed: 0.10
      angular_dist_threshold: 0.52
      forward_sampling_distance: 0.50
      rotate_to_heading_angular_vel: 0.35
      # Matches the locomotion wz slew (0.4 rad/s^2).
      max_angular_accel: 0.40
      simulate_ahead_time: 1.0
      # The executor ramps every command itself; ramp from the last command so
      # the shim does not wait for odometry to confirm each small step.
      closed_loop: false
      # DWB parameters (the shim delegates to DWB after heading alignment)
      debug_trajectory_details: false
      # The web view uses the chosen path; full candidate/score visualizations
      # allocate and serialize thousands of trajectories every control tick.
      publish_evaluation: false
      publish_trajectories: false
      publish_cost_grid_pc: false
      min_vel_x: -0.12
      min_vel_y: -0.18
      max_vel_x: 0.60
      max_vel_y: 0.18
      max_vel_theta: 0.45
      min_speed_xy: 0.0
      max_speed_xy: 0.60
      min_speed_theta: 0.0
      acc_lim_x: 0.30
      acc_lim_y: 0.20
      acc_lim_theta: 0.40
      decel_lim_x: -0.30
      decel_lim_y: -0.20
      decel_lim_theta: -0.40
      # Bound work per 50 ms cycle; preserve all axes and collision resolution.
      vx_samples: 9
      vy_samples: 7
      vtheta_samples: 11
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.50
      xy_goal_tolerance: 0.25  # Keep RotateToGoal aligned with the goal checker.
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "CruiseSpeed", "BaseObstacle"]
      CruiseSpeed.class: "unitree_nav2_core::CruiseSpeedCritic"
      CruiseSpeed.scale: 24.0
      BaseObstacle.scale: 0.04
      PathAlign.scale: 28.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 28.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 28.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    # The cart only has to follow the global path, so it uses Foxy's official
    # Regulated Pure Pursuit (vx + wz, no reversing or strafing) instead of a
    # sampling controller. Cart-frame commands enter the existing push policy;
    # the launch file reads max_vel_x / max_vel_theta from
    # config/pushcart_navigation.json. The adapter adds the web speed, the
    # final approach cap, open-loop ramping and a full-footprint arc check.
    CartPush:
      plugin: "unitree_nav2_core::CartPurePursuitController"
      # Web speed (0.20-0.60 m/s). Pure pursuit always aims at this speed, so
      # "auto" and "fixed" behave the same here; desired_linear_vel is unused.
      navigation_speed_mode: "auto"
      navigation_speed: 0.35
      # Linear cap from 0.80 m: navigation_speed -> 0.10 m/s at xy_goal_tolerance.
      approach_distance: 0.80
      approach_speed: 0.10
      xy_goal_tolerance: 0.25  # Keep aligned with goal_checker.
      max_vel_x: 0.60
      # Larger yaw rates are scaled down together with vx, keeping the arc.
      max_vel_theta: 0.40
      # Ramp from the last command; the executor filters every command (0.4 s)
      # and the measured cart velocity lags and is noisy.
      closed_loop: false
      # NavFn path conditioning before pursuit: resample every 2.5 cm, smooth
      # twice with a +/-0.10 m moving average (removes one-cell zigzags; a 90
      # deg corner is rounded by ~5 cm), resample again, headings = tangent.
      path_resolution: 0.025
      path_smoothing_distance: 0.10
      # The BT replans at 1 Hz. A new plan to the same goal is ignored while,
      # from 0.7 m to 3.7 m along it (never nearer than the shortest carrot), it stays within 5 cm of the current one;
      # a real route change (new obstacle, cart pushed off the path) exceeds it.
      path_keep_tolerance: 0.05
      path_compare_start: 0.70
      path_compare_length: 3.0
      # Carrot = commanded speed x 2.5 s, within 0.7-1.1 m (0.75 m at 0.30
      # m/s). 2026-10-20 23:04 on the robot the cart followed RPP wz with
      # ~0.8 s lag (cart student + body + casters; fitted 0.4 s response +
      # 0.4 s dead time) on a cart pose ~0.35 s old, and weaved +/-0.45 rad,
      # +/-0.25 m with an 8 s period on the former 1.5 s / 0.5-0.9 m carrot.
      # On that plant cart_rpp_regression reverses the turn 0-1 times instead
      # of 3-5 with this carrot; corners stay at ~0.15-0.17 m max offset.
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 2.5
      lookahead_dist: 0.90
      min_lookahead_dist: 0.70
      max_lookahead_dist: 1.10
      # Command ramps, applied by the adapter in every mode: wz never changes
      # faster than 0.6 rad/s^2 (pursuit, in-place turns and the switch
      # between them), and vx does not drop to zero at once when RPP switches
      # to an in-place turn. The executor's 0.4 s filter does not rate-limit
      # wz itself. 0.4 rad/s^2 (former cart DWB) lagged the pursuit loop: a
      # cart starting 25 cm off the path was still 8 cm off after 1 m.
      max_linear_accel: 0.30
      max_linear_decel: 0.30
      max_angular_accel: 0.60
      # Rotate in place when the carrot is more than 45 deg off the cart
      # heading (start of a goal, sharp corners) instead of swinging the cart.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.30
      # Turn to the goal heading inside this radius; must not exceed
      # xy_goal_tolerance or the cart would rotate outside the goal radius.
      # That final turn brakes as sqrt(2 x 0.6 x remaining angle), >= 0.10.
      goal_dist_tol: 0.25
      min_rotate_vel: 0.10
      # Slow down on tight path curvature (radius < 0.9 m) ...
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.10
      # ... and close to obstacles (cart-center cost, same 4.0 decay as the
      # inflation layer below).
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.60
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0
      # The adapter owns the final approach (approach_distance above).
      use_approach_linear_velocity_scaling: false
      min_approach_linear_velocity: 0.10
      # Stop (controller failure, BT waits and replans) if the combined cart
      # footprint would hit a lethal cell along the next 1.5 s of the arc.
      # 0.35 m at 0.35 m/s covers the 0.30 m/s^2 ramp plus the 0.4 s filter.
      max_allowed_time_to_collision: 1.5
      transform_tolerance: 0.30

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      # Collision checking reads this internal map, independently of display;
      # updated once per LiDAR frame and controller cycle.
      update_frequency: 20.0
      publish_frequency: 8.0
      global_frame: odom
      robot_base_frame: nav_control
      rolling_window: true
      # The 3 m radius covers the combined body plus the 1 s rollout. Keeping
      # the previous 8 m window at 2.5 cm would quadruple each critic's grid.
      width: 6
      height: 6
      resolution: 0.025
      footprint: "[[-0.30, -0.25], [-0.30, 0.25], [0.32, 0.25], [0.32, -0.25]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Rebuild through Nav2's clear service on mode changes, before opening
        # the gate. Never clear real obstacles inside the padded footprint.
        footprint_clearing_enabled: false
        observation_sources: scan rear_clear
        rear_clear:
          topic: /navigation/rear_clear
          data_type: "LaserScan"
          # Expire clearing rays even if their publisher exits before sending an empty scan.
          observation_persistence: 0.3
          expected_update_rate: 0.0
          marking: false
          clearing: true
          raytrace_range: 4.0
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
        scan:
          topic: /scan
          observation_persistence: 0.5
          # Seconds between observations; zero would consider a dead stream current forever.
          expected_update_rate: 0.5
          inf_is_valid: true
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          # Keep dynamic avoidance within the 4 m half-width rolling window;
          # long-range structure belongs to the static global map.
          obstacle_range: 3.5
          raytrace_range: 4.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.65
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: nav_control
      resolution: 0.05
      footprint: "[[-0.30, -0.25], [-0.30, 0.25], [0.32, 0.25], [0.32, -0.25]]"
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      # The BT replans /plan periodically, but it can only route around a
      # live obstacle if that obstacle is also present in the planner's
      # global costmap.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Clear only the fresh physical cart body, never the larger collision footprint.
        footprint_clearing_enabled: false
        observation_sources: scan rear_clear
        rear_clear:
          topic: /navigation/rear_clear
          data_type: "LaserScan"
          # Expire clearing rays even if their publisher exits before sending an empty scan.
          observation_persistence: 0.3
          expected_update_rate: 0.0
          marking: false
          clearing: true
          raytrace_range: 4.0
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
        scan:
          topic: /scan
          observation_persistence: 0.5
          # Seconds between observations; zero would consider a dead stream current forever.
          expected_update_rate: 0.5
          inf_is_valid: true
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          obstacle_range: 3.5
          raytrace_range: 4.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.65
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: false

recoveries_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "back_up", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    back_up:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: nav_control
    transform_timeout: 0.20
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.40
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.40

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
